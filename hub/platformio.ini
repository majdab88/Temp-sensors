[env:xiao_esp32c6_hub]
platform  = espressif32
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.1.3/esp32-3.1.3.zip
board     = seeed_xiao_esp32c6
framework = arduino

; NimBLE + WebServer won't fit in the default 1.25 MB app partition
board_build.partitions = huge_app.csv

build_flags = -Os   ; Smallest Code

lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    knolleary/PubSubClient@^2.8
