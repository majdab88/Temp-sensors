[env:xiao_esp32c6_hub]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = seeed_xiao_esp32c6
framework = arduino

; NimBLE + WebServer won't fit in the default 1.25 MB app partition.
; min_spiffs.csv gives two 1920 KiB OTA slots (app0/app1) instead of huge_app's
; single 3 MB slot — required for firmware OTA. nvs stays at 0x9000/0x5000 in
; both tables, so reflashing over huge_app preserves WiFi + cloud credentials.
; Do not erase_flash when migrating a provisioned hub.
board_build.variant    = esp32c6
board_build.partitions = min_spiffs.csv

build_flags =
    -Os                          ; Smallest Code
    -DARDUINO_USB_MODE=1         ; Use Hardware CDC (HWCDC) — required on ESP32-C6
    -DARDUINO_USB_CDC_ON_BOOT=1  ; Enable USB-CDC Serial from first boot byte

lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    knolleary/PubSubClient@^2.8
    
monitor_speed = 115200