; PlatformIO Project Configuration File — NTC Probe Sensor
; No external sensor libraries needed; temperature is calculated from raw ADC.
;
; Two orthogonal build flags control hardware-specific behaviour:
;
;   BOARD_REV     — physical board layout
;     1 = XIAO ESP32-C6 carrier (GPIO14 ext-antenna switch, LED on GPIO15)
;     2 = bare ESP32-C6-WROOM-1U PCB (ESP-PROG header, LED on GPIO5)
;
;   HAS_REGULATOR — power topology
;     0 = battery wired directly to 3V3 pin (VCC = bat_v, tracks cell)
;     1 = external 3.3 V regulator between battery and 3V3 pin (VCC = constant 3.3 V)
;
; Three valid combinations, one env each:
;   xiao_esp32c6_sensor_ntc        BOARD_REV=1  HAS_REGULATOR=0  (original XIAO, no regulator)
;   xiao_with_regulator_sensor_ntc BOARD_REV=1  HAS_REGULATOR=1  (XIAO + external TPS63802 module — current)
;   wroom_v2_sensor_ntc            BOARD_REV=2  HAS_REGULATOR=1  (bare WROOM PCB with onboard TPS63802)

[env:xiao_esp32c6_sensor_ntc]
; Original XIAO carrier — battery directly to 3V3 pin (no regulator).
; VCC for NTC math tracks the battery voltage.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.variant = esp32c6
board = seeed_xiao_esp32c6
framework = arduino
build_flags =
	-Os
	-DBOARD_REV=1
	-DHAS_REGULATOR=0
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

[env:xiao_with_regulator_sensor_ntc]
; XIAO carrier with an external TPS63802 buck-boost module wired between
; battery and the XIAO's 3V3 pin. Hardware is otherwise identical to the
; original XIAO build, but VCC for the NTC divider is now a fixed 3.3 V.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.variant = esp32c6
board = seeed_xiao_esp32c6
framework = arduino
build_flags =
	-Os
	-DBOARD_REV=1
	-DHAS_REGULATOR=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

[env:wroom_v2_sensor_ntc]
; v2 hardware: bare ESP32-C6-WROOM-1U on custom PCB with onboard TPS63802.
; Flashed via ESP-PROG. No USB-CDC on the board, so USB CDC build flags are off.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.variant = esp32c6
board = esp32-c6-devkitm-1
framework = arduino
build_flags =
	-Os
	-DBOARD_REV=2
	-DHAS_REGULATOR=1
upload_speed = 460800
monitor_speed = 115200
