; PlatformIO — sensor-wifi: mains-powered WiFi NTC sensor with Li-ion backup.
; Talks to the cloud directly over MQTT/TLS, presenting itself as a hub whose
; only sensor is itself. See ../DESIGN.md.
;
; Flashed with an ESP-PROG on J_PROG, the same 2x3 header as sensor-ntc v2; the
; ESP-PROG drives EN and GPIO9 itself. The board's USB-C is power only, so there
; is no USB-CDC: Serial is UART0 on GPIO16/17.

[env:wifi_sensor]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-c6-devkitm-1
framework = arduino
board_build.variant    = esp32c6

; Two 1920 KiB OTA slots like the hub (NimBLE + TLS + HTTP need the room), and
; the 128 KiB that min_spiffs gives to SPIFFS used instead as a raw ring log.
board_build.partitions = partitions.csv

; NOT YET DONE: the board has a 32.768 kHz crystal on GPIO0/1 so the RTC keeps
; accurate time through a multi-day outage, but this build still runs the RTC
; from the internal RC. Selecting the crystal is CONFIG_RTC_CLK_SRC_EXT_CRYS=y
; via custom_sdkconfig, which makes pioarduino rebuild the framework -- and on
; the dev machine that fails because tool-cmake/tool-ninja are empty packages.
; Do it at board bring-up, where the crystal can actually be seen to start.

build_flags =
    -Os

lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    knolleary/PubSubClient@^2.8

upload_speed  = 460800
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Deliberately broken build, for proving the rollback path. It never delivers a
; reading, which is what confirms an image, so after 3 boots (or 5 minutes on
; mains, three times) it must revert to the previous image by itself.
;
;   pio run -e wifi_sensor_rollbacktest
; ---------------------------------------------------------------------------
[env:wifi_sensor_rollbacktest]
extends = env:wifi_sensor
build_flags =
    ${env:wifi_sensor.build_flags}
    -DOTA_ROLLBACK_TEST
    -DFW_PATCH=99
